name: eBay Alert Scan

on:
  schedule:
    - cron: '*/30 * * * *'   # GitHub's own schedule is unreliable for 5-min precision - cron-job.org triggers this more precisely via workflow_dispatch below
  workflow_dispatch:          # allows manual runs from the Actions tab, and external triggers via the GitHub API (used by cron-job.org)

# Prevent overlapping runs (scheduled + cron-job.org dispatch) from racing
# each other's git state and causing push conflicts.
concurrency:
  group: ebay-alert-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run eBay scan
        env:
          EBAY_CLIENT_ID:      ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET:  ${{ secrets.EBAY_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EBAY_ZIP:            ${{ secrets.EBAY_ZIP }}
        run: python bot.py

      - name: Save bot state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_listings.json item_search_metadata.json
          git add -A -- pending_alerts.json
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "Update seen listings / search metadata / pending alerts"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
